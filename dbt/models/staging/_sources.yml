version: 2

sources:
  - name: nfl_raw
    description: "Original source records loaded by the Python ingestion scripts."
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: RAW

    tables:
      - name: concussions
        identifier: CONCUSSIONS
        description: >
          Manually collected NFL concussion counts for 2015–2024.
          Includes preseason and regular season, excluding postseason.

      - name: ir_transactions
        identifier: IR_TRANSACTIONS
        description: >
          Manually collected Reserve/Injured transactions for seasons
          2015–2025, covering August through February.
          Original rows are retained, including duplicate records.

      - name: nflverse_injuries
        identifier: NFLVERSE_INJURIES
        description: >
          nflverse injury-report records from the downloaded
          2015–2025 season snapshots.
          Observed coverage includes regular season and postseason,
          with missing later postseason rounds in the 2023 snapshot.
          One source record does not necessarily represent a new injury.
